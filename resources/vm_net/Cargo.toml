[package]
name = "vm_net"
version = "0.1.1"
edition = "2021"
description = "Per-VM libvirt NAT network configuration and destination-IP filtering"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmltree = "0.11"
sha2 = "0.10"
libc = "0.2"

[profile.release]
strip = true
lto = true
